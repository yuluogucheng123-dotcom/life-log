<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程制图 · 第一章第一节 制图基本知识（国家标准）动画记忆</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --panel:#1c2128; --line:#30363d;
  --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --accent2:#f0883e;
  --good:#3fb950; --bad:#f85149; --warn:#d29922; --purple:#bc8cff;
  --mono:"Cascadia Mono","Consolas","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 20% -10%,#1b2432 0%,var(--bg) 55%) fixed;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100vh}

/* ========== 顶栏 ========== */
header{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(22,27,34,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
  flex:0 0 auto;z-index:20;
}
.brand{font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap}
.brand span{color:var(--accent)}
.chapter-tag{
  font-size:12px;color:var(--dim);border:1px solid var(--line);
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
.scene-title{font-size:13px;color:var(--accent2);font-weight:600;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
button.tb{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;
  font-family:inherit;transition:.16s;white-space:nowrap;
}
button.tb:hover{background:#2d333b;border-color:var(--accent);color:var(--accent)}
button.tb.on{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:700}
button.tb:active{transform:scale(.95)}

/* 进度条 */
#bar{height:3px;background:var(--line);flex:0 0 auto;position:relative}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple));
  transition:width .25s ease}

/* ========== 主体 ========== */
main{flex:1;display:flex;overflow:hidden;min-height:0}
#left{
  width:290px;flex:0 0 auto;border-right:1px solid var(--line);
  background:rgba(22,27,34,.6);overflow-y:auto;padding:12px;
}
#left::-webkit-scrollbar{width:8px}
#left::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
.nav-group{font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 7px;padding-left:4px}
.nav-group:first-child{margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;transition:.15s;border:1px solid transparent;
  margin-bottom:3px;line-height:1.35;
}
.nav-item:hover{background:#21262d}
.nav-item.active{background:linear-gradient(90deg,rgba(88,166,255,.22),transparent);
  border-color:var(--accent);color:var(--accent);font-weight:600}
.nav-item.done .dot{background:var(--good);border-color:var(--good);color:#04101f}
.dot{
  width:20px;height:20px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;
  color:var(--dim);font-family:var(--mono);transition:.2s;
}
.nav-item.active .dot{border-color:var(--accent);color:var(--accent);font-weight:700}

#right{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* 舞台 */
#stage{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:20px 26px;
  scroll-behavior:smooth;
}
#stage::-webkit-scrollbar{width:10px}
#stage::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px}
.slide{display:none;animation:fadeUp .45s ease both;max-width:1050px;margin:0 auto}
.slide.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h2.sh{
  font-size:21px;margin-bottom:6px;display:flex;align-items:center;gap:11px;
  padding-bottom:11px;border-bottom:2px solid var(--line);
}
h2.sh .num{
  background:linear-gradient(135deg,var(--accent),var(--purple));color:#04101f;
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:16px;font-weight:700;flex:0 0 auto;
}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.7}
.gb{
  display:inline-block;background:rgba(210,153,34,.14);color:var(--warn);
  border:1px solid rgba(210,153,34,.4);border-radius:5px;padding:1px 7px;
  font-size:11.5px;font-family:var(--mono);font-weight:600;
}

/* 定义卡片 */
.def{
  background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:15px 18px;margin:13px 0;position:relative;
}
.def .label{
  position:absolute;top:-9px;left:14px;background:var(--accent);color:#04101f;
  font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.5px;
}
.def p{font-size:14.5px;line-height:2;color:#c9d1d9}
.def.heat{border-left-color:var(--accent2);box-shadow:0 0 0 1px rgba(240,136,62,.25)}
.def.heat .label{background:var(--accent2)}

/* 逐字高亮 */
.w{
  display:inline-block;opacity:.16;transition:opacity .28s ease,color .28s ease;
  border-radius:3px;padding:0 1px;
}
.w.on{opacity:1;color:#fff}
.w.key{color:var(--accent2);font-weight:700}
.w.key.on{
  color:#04101f;background:var(--accent2);font-weight:700;
  box-shadow:0 0 14px rgba(240,136,62,.6);
}
.w.hit{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

/* 数据表 */
table.dt{
  width:100%;border-collapse:collapse;margin:13px 0;font-size:13px;
  background:var(--bg2);border-radius:9px;overflow:hidden;
}
table.dt th,table.dt td{border:1px solid var(--line);padding:8px 10px;text-align:center}
table.dt th{background:#21262d;color:var(--accent);font-weight:600;font-size:12.5px}
table.dt td{font-family:var(--mono);font-size:13px}
table.dt tr.blink td{animation:cellGlow 1.1s ease}
@keyframes cellGlow{
  0%{background:transparent}
  35%{background:rgba(240,136,62,.42);color:#fff;font-weight:700}
  100%{background:transparent}
}
table.dt td.hl{color:var(--accent2);font-weight:700}

/* 画布 */
.stagebox{
  background:#fbfbf7;border-radius:11px;padding:10px;margin:14px 0;
  border:1px solid var(--line);position:relative;
}
.stagebox.dark{background:#0a0e14}
canvas{display:block;width:100%;height:auto;border-radius:5px}
.cap{font-size:11.5px;color:var(--dim);text-align:center;margin-top:7px}
.stagebox .cap{color:#6e7781}

/* 网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
}
.card h4{font-size:14px;margin-bottom:9px;color:var(--accent);display:flex;gap:7px;align-items:center}
.card h4 .ic{font-size:15px}
.card ul{margin-left:17px;font-size:13px;line-height:1.95;color:#adbac7}
.card ul li{margin-bottom:3px}
.card ul li b{color:var(--accent2)}

/* 口诀 */
.mnemonic{
  background:linear-gradient(135deg,rgba(188,140,255,.15),rgba(88,166,255,.09));
  border:1px solid rgba(188,140,255,.42);border-radius:11px;padding:15px 18px;margin:14px 0;
}
.mnemonic .t{font-size:11.5px;color:var(--purple);font-weight:700;letter-spacing:1.4px;margin-bottom:9px}
.mnemonic .verse{
  font-size:17px;line-height:2.05;color:#fff;font-weight:600;letter-spacing:1.6px;
  font-family:"KaiTi","STKaiti",serif;
}
.mnemonic .verse em{color:var(--accent2);font-style:normal;
  border-bottom:2px solid var(--accent2);padding-bottom:1px}
.mnemonic .note{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.8}

/* 易错对比 */
.trap{
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0;
  background:var(--bg2);
}
.trap .th{padding:9px 14px;font-size:13px;font-weight:600;background:#21262d;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.trap .tb{display:grid;grid-template-columns:1fr 1fr}
.trap .side{padding:13px 15px;font-size:13px;line-height:1.85}
.trap .side.bad{border-right:1px solid var(--line);color:#ffb3ae}
.trap .side.good{color:#9ae6a0}
.trap .side .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  display:inline-block;margin-bottom:8px;letter-spacing:.5px}
.trap .side.bad .tag{background:rgba(248,81,73,.2);color:var(--bad);border:1px solid rgba(248,81,73,.45)}
.trap .side.good .tag{background:rgba(63,185,80,.18);color:var(--good);border:1px solid rgba(63,185,80,.45)}
.cross{color:var(--bad);font-weight:700}
.tick{color:var(--good);font-weight:700}

/* 操作提示 */
.hint{
  font-size:12px;color:var(--dim);background:rgba(88,166,255,.07);
  border:1px dashed rgba(88,166,255,.32);border-radius:8px;padding:9px 13px;margin:12px 0;
}
.hint b{color:var(--accent)}

/* 底栏 */
footer{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 18px;
  background:rgba(22,27,34,.94);border-top:1px solid var(--line);z-index:20;
}
.btn{
  padding:9px 17px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;font-size:13px;font-family:inherit;transition:.16s;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#3d7dd8);
  color:#04101f;font-weight:700;border:none}
.btn.primary:hover{filter:brightness(1.12);color:#04101f}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.foot-info{font-size:12px;color:var(--dim);flex:1;text-align:center;
  font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-pill{
  font-size:11.5px;font-family:var(--mono);background:var(--panel);
  border:1px solid var(--line);padding:4px 11px;border-radius:20px;color:var(--dim);
  white-space:nowrap;
}
.prog-pill b{color:var(--good)}

/* 测验 */
.quiz{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:17px 20px;margin:14px 0}
.quiz .q{font-size:14.5px;line-height:1.85;margin-bottom:13px;font-weight:600}
.quiz .q .idx{color:var(--accent2);font-family:var(--mono);margin-right:7px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  padding:11px 15px;border:1px solid var(--line);border-radius:9px;cursor:pointer;
  font-size:13.5px;transition:.16s;background:#1c2128;display:flex;gap:11px;align-items:flex-start;
  line-height:1.7;
}
.opt:hover{border-color:var(--accent);background:#22272e}
.opt .letter{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;
  font-family:var(--mono);font-weight:700;transition:.2s;
}
.opt.right{border-color:var(--good);background:rgba(63,185,80,.14);color:#b7f5bd}
.opt.right .letter{background:var(--good);color:#04101f;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(248,81,73,.13);color:#ffb3ae}
.opt.wrong .letter{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.locked{cursor:default;opacity:.75}
.opt.locked.right,.opt.locked.wrong{opacity:1}
.explain{
  margin-top:12px;padding:12px 15px;border-radius:9px;font-size:13px;line-height:1.9;
  background:rgba(88,166,255,.09);border-left:3px solid var(--accent);display:none;
  color:#c9d1d9;
}
.explain.show{display:block;animation:fadeUp .3s ease both}
.explain b{color:var(--accent)}
.score{
  font-size:15px;text-align:center;padding:17px;border-radius:10px;margin-top:15px;
  background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);line-height:1.9;
}
.score b{font-size:26px;color:var(--good);font-family:var(--mono)}

/* 空白自测 */
.blank{
  display:inline-block;min-width:74px;border-bottom:2px dashed var(--accent2);
  text-align:center;cursor:pointer;color:var(--accent2);font-weight:700;
  padding:0 6px;transition:.2s;
}
.blank:hover{background:rgba(240,136,62,.13)}
.blank.revealed{color:var(--good);border-bottom-color:var(--good);border-bottom-style:solid}

/* 线型样例 */
.linesamp{margin:9px 0}
.linesamp .row{display:flex;align-items:center;gap:14px;padding:7px 0;
  border-bottom:1px dashed #2a3038}
.linesamp .row:last-child{border-bottom:none}
.linesamp svg{flex:0 0 190px}
.linesamp .nm{font-size:13px;font-weight:600;color:var(--accent2);flex:0 0 92px}
.linesamp .ds{font-size:12.5px;color:#adbac7;line-height:1.65}
.kbd{
  font-family:var(--mono);font-size:11px;background:#21262d;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--dim);
}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="brand">工程制图 <span>· 动画记忆</span></div>
  <div class="chapter-tag">第一章 制图基本知识</div>
  <div class="scene-title" id="sceneTitle">第一节 国家标准《技术制图》的基本规定</div>
  <div class="toolbar">
    <button class="tb" id="btnPlay" title="播放/暂停当前场景动画">⏸ 暂停</button>
    <button class="tb" id="btnReplay" title="重播当前场景">↻ 重播</button>
    <button class="tb" id="btnSpeed" title="切换动画速度">1.0×</button>
    <button class="tb" id="btnSpeech" title="开启后逐字朗读定义">🔊 朗读</button>
    <button class="tb" id="btnMotion" title="减少动画，适合快速阅读">🎞 精简</button>
  </div>
</header>
<div id="bar"><div id="barFill"></div></div>

<main>
  <nav id="left"></nav>
  <div id="right">
    <div id="stage"></div>
  </div>
</main>

<footer>
  <button class="btn" id="btnPrev">← 上一节</button>
  <div class="foot-info" id="footInfo">—</div>
  <span class="prog-pill" id="progPill">进度 <b>0</b>/0</span>
  <button class="btn primary" id="btnNext">下一节 →</button>
</footer>
</div>

<script>
/* =========================================================================
   工程制图 第一章第一节 —— 国家标准《技术制图》基本规定 · 动画记忆引擎
   全部内容依据 GB/T 14689-2008（图纸幅面和格式）、GB/T 14690-1993（比例）、
   GB/T 14691-1993（字体）、GB/T 17450-1998 / GB/T 4457.4-2002（图线）、
   GB/T 4458.4-2003（尺寸注法）
   ========================================================================= */
"use strict";

/* ---------- 全局状态 ---------- */
const S = {
  idx: 0,
  playing: true,
  speed: 1,
  speech: false,
  motion: true,      // false = 精简模式（跳过逐字动画）
  timers: [],
  spoken: [],        // 已朗读的文本，避免重复
  done: new Set(),
  quizAnswers: {}
};

/* ---------- 工具 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function clearTimers(){
  S.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  S.timers = [];
}
function later(fn, ms){
  const id = setTimeout(fn, ms);
  S.timers.push(id);
  return id;
}
function every(fn, ms){
  const id = setInterval(fn, ms);
  S.timers.push(id);
  return id;
}
function stopSpeech(){
  if ("speechSynthesis" in window) { try{ speechSynthesis.cancel(); }catch(e){} }
}
function speak(text){
  if (!S.speech || !("speechSynthesis" in window)) return;
  if (S.spoken.includes(text)) return;
  S.spoken.push(text);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 0.95; u.pitch = 1;
  try{ speechSynthesis.speak(u); }catch(e){}
}

/* =========================================================================
   通用动画原语
   ========================================================================= */

/* 逐字高亮：把含 <b> 的 HTML 拆成逐字 span，关键处（<b>）标 .key */
function buildWords(html){
  const out = [];
  // 用占位符保护标签，按「字符」切开，<b> 段标 key
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  (function walk(node, isKey){
    node.childNodes.forEach(ch => {
      if (ch.nodeType === 3){
        for (const c of ch.textContent){
          out.push({ ch: c, key: isKey });
        }
      } else if (ch.nodeType === 1){
        walk(ch, isKey || ch.tagName === "B");
      }
    });
  })(tmp, false);
  return out;
}

/* 给 .def 里的文字逐字上屏 */
function animateDefinition(el, {delay=0, perChar=34, speakText=null} = {}){
  const src = el.dataset.raw || el.innerHTML;
  el.dataset.raw = src;
  const words = buildWords(src);
  el.innerHTML = "";
  const frag = document.createDocumentFragment();
  const spans = [];
  words.forEach(w => {
    if (w.ch === "\n"){ frag.appendChild(document.createElement("br")); return; }
    const sp = document.createElement("span");
    sp.className = "w" + (w.key ? " key" : "");
    sp.textContent = w.ch === " " ? "\u00a0" : w.ch;
    frag.appendChild(sp);
    spans.push(sp);
  });
  el.appendChild(frag);

  if (!S.motion){ spans.forEach(s => s.classList.add("on")); return spans; }

  spans.forEach((sp, i) => {
    later(() => {
      if (!S.playing) return;
      sp.classList.add("on");
      if (sp.classList.contains("key")){
        sp.classList.add("hit");
        later(() => sp.classList.remove("hit"), 420);
      }
      // 每读一小段做一次语音（按句读，避免碎片化）
      if (i === spans.length - 1 && speakText) speak(speakText);
    }, delay + i * perChar);
  });
  return spans;
}

/* 数字滚动 */
function countUp(el, to, {dur=900, delay=0, suffix=""} = {}){
  later(() => {
    const t0 = performance.now();
    const from = 0;
    function step(t){
      if (!S.playing) return;
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e) + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }, delay);
}

/* 高亮表格列 */
function glowCell(sel, delay=0){
  later(() => {
    if (!S.playing) return;
    const tr = document.querySelector(sel);
    if (!tr) return;
    tr.classList.add("blink");
    later(() => tr.classList.remove("blink"), 1200);
  }, delay);
}

/* =========================================================================
   画布绘制助手
   ========================================================================= */
function setupCanvas(cv, h){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth - 20;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h };
}

/* 通用：按 t (0..1) 生长的多段路径动画
   segs: [{pts:[[x,y],...], width, color, dash, capStart, capEnd}] */
function playSegs(cv, h, segs, {dur=1300, delay=0, fill=null, bg=null,
                                onDone=null, labels=null, anim=true} = {}){
  const { g, w } = setupCanvas(cv, h);
  const DPR = window.devicePixelRatio || 1;
  void DPR;

  function paint(t){
    g.clearRect(0, 0, w, h);
    if (bg){ g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    if (fill){
      g.beginPath(); fill.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.closePath();
      g.fillStyle = fill.color || "rgba(255,214,102,.55)";
      g.fill();
    }
    // 计算总长度
    let total = 0;
    const lens = segs.map(s => {
      let L = 0;
      for (let i = 1; i < s.pts.length; i++){
        L += Math.hypot(s.pts[i][0] - s.pts[i-1][0], s.pts[i][1] - s.pts[i-1][1]);
      }
      total += L; return L;
    });
    let budget = total * t;
    segs.forEach((s, si) => {
      const L = lens[si];
      const draw = Math.max(0, Math.min(L, budget));
      budget -= L;
      if (draw <= 0) return;
      g.save();
      g.strokeStyle = s.color; g.lineWidth = s.width || 2;
      g.lineCap = s.cap || "round"; g.lineJoin = "round";
      if (s.dash) g.setLineDash(s.dash);
      g.beginPath();
      let acc = 0, started = false;
      g.moveTo(s.pts[0][0], s.pts[0][1]);
      for (let i = 1; i < s.pts.length; i++){
        const a = s.pts[i-1], b = s.pts[i];
        const seg = Math.hypot(b[0]-a[0], b[1]-a[1]);
        if (acc + seg <= draw){
          g.lineTo(b[0], b[1]); acc += seg; started = true;
        } else {
          const r = seg > 0 ? (draw - acc) / seg : 0;
          g.lineTo(a[0] + (b[0]-a[0])*r, a[1] + (b[1]-a[1])*r);
          break;
        }
      }
      g.stroke();
      g.restore();
      void started;
    });
    // 标注
    if (labels && t > .96){
      labels.forEach(L => {
        g.save();
        g.fillStyle = L.color || "#333";
        g.font = L.font || "600 13px 'Microsoft YaHei',sans-serif";
        g.textAlign = L.align || "left";
        g.textBaseline = L.base || "middle";
        if (L.bg){
          const tw = g.measureText(L.text).width;
          const px = L.align === "center" ? L.x - tw/2 : (L.align === "right" ? L.x - tw : L.x);
          g.fillStyle = L.bg;
          g.fillRect(px - 5, L.y - 11, tw + 10, 22);
          g.fillStyle = L.color || "#333";
        }
        g.fillText(L.text, L.x, L.y);
        g.restore();
      });
    }
  }

  if (!anim){ paint(1); if (onDone) later(onDone, 0); return; }

  later(() => {
    const t0 = performance.now();
    const D = dur / S.speed;
    function frame(now){
      if (!S.playing) return;
      const p = Math.min(1, (now - t0) / D);
      paint(1 - Math.pow(1 - p, 2.2));
      if (p < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }, delay);
}

        // 间距标注
        const y1 = oy + oh + 30, y2 = oy + oh + 60;

        g.fillText("✓ 小尺寸在内（70）→ 大尺寸在外（260）", ox, 32);
        g.restore();
      }
    }
    if (!S.motion){ paint(1); return; }
    later(() => {
      const t0 = performance.now(), D = 1900 / S.speed;
      (function f(now){
        if (!S.playing) return;
        const p = Math.min(1, (now - t0) / D);
        paint(p); if (p < 1) requestAnimationFrame(f);
      })(performance.now());
    }, 250);
  }
});

      GB/T 14690—1993《技术制图 比例》、GB/T 14691—1993《技术制图 字体》、
      GB/T 17450—1998《技术制图 图线》、GB/T 4458.4—2003《机械制图 尺寸注法》整理。
      不同版本教材在小节划分与举例上可能略有差异，请以你所用教材的目录为准。
    </div>
  `,
  anim(){}
});

/* =========================================================================
   渲染 / 导航
   ========================================================================= */
const navEl = $("#left");
function buildNav(){
  navEl.innerHTML = "";
  let lastGroup = null;
  SLIDES.forEach((s, i) => {
    if (s.group !== lastGroup){
      const g = document.createElement("div");
      g.className = "nav-group";
      g.textContent = s.group;
      navEl.appendChild(g);
      lastGroup = s.group;
    }
    const d = document.createElement("div");
    d.className = "nav-item";
    d.dataset.i = i;
    d.innerHTML = `<span class="dot">${i}</span><span>${s.nav}</span>`;
    d.addEventListener("click", () => go(i));
    navEl.appendChild(d);
  });
}

const stageEl = $("#stage");
function renderShell(){
  stageEl.innerHTML = SLIDES.map((s, i) =>
    `<section class="slide" id="sl${i}">${s.html}</section>`).join("");
}

function syncNav(){
  $$(".nav-item").forEach((el, i) => {
    el.classList.toggle("active", i === S.idx);
    el.classList.toggle("done", S.done.has(i) && i !== S.idx);
  });
  const on = navEl.querySelector(".nav-item.active");
  if (on) on.scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("#progPill").innerHTML = `进度 <b>${S.done.size}</b>/${SLIDES.length}`;
  $("#sceneTitle").textContent = SLIDES[S.idx].title;
  $("#footInfo").textContent = `${S.idx + 1} / ${SLIDES.length} · ${SLIDES[S.idx].nav}`;
  $("#barFill").style.width = ((S.idx + 1) / SLIDES.length * 100) + "%";
  $("#btnPrev").disabled = S.idx === 0;
  $("#btnNext").disabled = S.idx === SLIDES.length - 1;
}

function go(i, {silent=false}={}){
  if (i < 0 || i >= SLIDES.length) return;
  clearTimers();
  stopSpeech();
  S.spoken = [];
  S.idx = i;
  if (!silent) S.done.add(i);
  $$(".slide").forEach((el, k) => el.classList.toggle("show", k === i));
  stageEl.scrollTop = 0;
  syncNav();
  const s = SLIDES[i];
  // 等布局完成后再执行动画
  later(() => { try{ s.anim && s.anim(); }catch(err){ console.warn("anim error", err); } }, 60);
  bindBlanks();
}

/* 挖空交互 */
function bindBlanks(){
  $$(".blank").forEach(b => {
    if (b.dataset.bound) return;
    b.dataset.bound = "1";
    b.textContent = "？".repeat(Math.max(2, Math.min(6, b.dataset.a.length)));
    b.addEventListener("click", () => {
      if (b.classList.contains("revealed")) return;
      b.textContent = b.dataset.a;
      b.classList.add("revealed");
      b.style.animation = "pop .45s ease";
      later(() => { b.style.animation = ""; }, 500);
    });
  });
}

/* =========================================================================
   控件事件
   ========================================================================= */
$("#btnPrev").addEventListener("click", () => go(S.idx - 1));
$("#btnNext").addEventListener("click", () => go(S.idx + 1));

$("#btnPlay").addEventListener("click", () => {
  S.playing = !S.playing;
  const b = $("#btnPlay");
  b.textContent = S.playing ? "⏸ 暂停" : "▶ 继续";
  b.classList.toggle("on", !S.playing);
  if (S.playing){
    // 重播当前场景，保证动画连续
    clearTimers(); stopSpeech(); S.spoken = [];
    const s = SLIDES[S.idx];
    later(() => { s.anim && s.anim(); }, 40);
    bindBlanks();
  }
});

$("#btnReplay").addEventListener("click", () => {
  clearTimers(); stopSpeech(); S.spoken = [];
  S.playing = true;
  $("#btnPlay").textContent = "⏸ 暂停";
  $("#btnPlay").classList.remove("on");
  const s = SLIDES[S.idx];
  // 重置已高亮的字
  $$(".def").forEach(d => {
    const raw = d.dataset.raw;
    if (raw){ d.innerHTML = raw; d.dataset.raw = raw; }
  });
  later(() => { s.anim && s.anim(); }, 50);
  bindBlanks();
});

$("#btnSpeed").addEventListener("click", () => {
  const opts = [1, 1.5, 2, 0.6];
  const cur = opts.indexOf(S.speed);
  S.speed = opts[(cur + 1) % opts.length];
  $("#btnSpeed").textContent = S.speed.toFixed(1) + "×";
  $("#btnSpeed").classList.toggle("on", S.speed !== 1);
});

$("#btnSpeech").addEventListener("click", () => {
  S.speech = !S.speech;
  const b = $("#btnSpeech");
  b.classList.toggle("on", S.speech);
  b.textContent = S.speech ? "🔊 朗读中" : "🔊 朗读";
  if (S.speech){
    speak("朗读已开启");
    // 立即补读当前页定义
    S.spoken = [];
    const s = SLIDES[S.idx];
    s.anim && s.anim();
  } else stopSpeech();
});

$("#btnMotion").addEventListener("click", () => {
  S.motion = !S.motion;
  const b = $("#btnMotion");
  b.classList.toggle("on", !S.motion);
  b.textContent = S.motion ? "🎞 精简" : "🎞 已精简";
  clearTimers(); stopSpeech(); S.spoken = [];
  $$(".def").forEach(d => {
    const raw = d.dataset.raw;
    if (raw){ d.innerHTML = raw; d.dataset.raw = raw; }
  });
  const s = SLIDES[S.idx];
  later(() => { s.anim && s.anim(); }, 40);
  bindBlanks();
});

/* 键盘 */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(S.idx + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); go(S.idx - 1); }
  else if (e.key === " "){ e.preventDefault(); $("#btnPlay").click(); }
  else if (e.key === "r" || e.key === "R"){ $("#btnReplay").click(); }
});

/* 窗口尺寸变化时重绘当前画布 */
let rzT = null;
window.addEventListener("resize", () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (!S.playing) return;
    const s = SLIDES[S.idx];
    clearTimers();
    $$(".def").forEach(d => {
      const raw = d.dataset.raw;
      if (raw){ d.innerHTML = raw; d.dataset.raw = raw; }
    });
    s.anim && s.anim();
    bindBlanks();
  }, 250);
});

/* =========================================================================
   启动
   ========================================================================= */
buildNav();
renderShell();
go(0);
</script>
</body>
</html>
